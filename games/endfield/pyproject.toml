[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-framework-endfield"
dynamic = ["version"]
description = "终末地伤害计算小工具"
authors = [
    { name = "wxhwwla", email = "wxhwwla@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "calc-framework>=0.2.0",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
# 开发 / CI：pytest
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]
# 与运行时重复，保留别名便于旧文档/命令
viz = [
    "matplotlib>=3.8",
]
# 插件 YAML 支持（JSON 无需此依赖）
plugins = [
    "pyyaml>=6.0",
]
# 打包：PyInstaller（会拉取 PyPI 的 packaging 等传递依赖；勿建名为 packaging 的本地包）
build = [
    "pyinstaller>=6.0",
]
# OCR 截图识装（可选运行时）
ocr = [
    "easyocr>=1.7",
    "torch>=2.0",
    "torchvision>=0.18",
    "pillow>=10.0",
]

[project.scripts]
endfield-calculator = "main:main"

[tool.setuptools.dynamic]
version = { attr = "please_read_me._VERSION" }

[tool.setuptools]
py-modules = ["main", "please_read_me"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "gui_design*",
    "character_weapon_equipment*",
    "legal*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
# 本地日常：pytest -m "not integration and not real_data and not slow"
# CI 仍跑全量：pytest tests/ -q
# --cov-fail-under=60 对应长期目标 80%，目前先提至 60
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: 耗时 > 5 秒的测试，本地日常跳过",
    "integration: 依赖外部系统（文件 I/O、DB）的测试",
    "real_data: 使用真实游戏 JSON 数据的测试",
]

[tool.coverage.run]
source = ["calculation", "data", "gui_design"]

[tool.coverage.report]
fail_under = 60
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]

[tool.ruff]
# 第三级严格度（strict 为第四级）：E/F/W 基础 + I 导入 + N 命名 + UP 现代化 + SIM 简化 + RUF 专用
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # 允许中文全角字符（项目UI使用中文）
    "RUF002",  # 允许中文全角标点（项目文档使用中文）
    "RUF003",  # 允许注释使用中文全角标点
    "RUF012",  # 允许 mutable class vars
    "E402",    # 允许 WMI 补丁在 import CTk 之前运行
    "N812",    # 允许下层 import 用别名
    "N803",    # 允许参数名大写（与数据字段名一致）
    "SIM108",  # 允许 if-else 替代三元表达式
    "SIM117",  # 允许嵌套 with
    "SIM102",  # 允许嵌套 if（可读性优先）
    "SIM105",  # 允许 try-except-pass 替代 contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF", "N802", "N806", "SIM115"]
"gui_design/*" = ["N802", "N806"]  # 允许 GUI 控件名使用下划线/大写
"gui_design/controls/search/section.py" = ["F821"]  # 函数内局部 import，ruff 静态分析误报
"gui_design/controls/enhancement/dialogs.py" = ["F821"]  # 同上
"gui_design/controls/enhancement/section.py" = ["F821"]  # 同上
"**/__init__.py" = ["F401"]  # __init__.py 的显式 re-export
"character_weapon_equipment/weapon_data/special_fields/__init__.py" = ["F403"]  # 子模块聚合 re-export
"character_weapon_equipment/weapon_data/add_weapon.py" = ["E501"]  # 独立脚本，docstring 行长超限制

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ═══════════════════════════════════════════════════════
# 类型注解规范（Pylance / pyright）
# ═══════════════════════════════════════════════════════
#
# 在双后端架构（CTk + PySide6）下，以下规则可避免类型错误：
#
# 1. dict 注解必须与实际 value 类型一致
#    ✅ manual_buffs: dict[str, list[dict[str, str | float]]]
#    ❌ manual_buffs: dict[str, list[dict[str, float]]]
#    # effect_type 是 str，value 是 float，所以是 str | float
#
# 2. 函数参数接受 None 时用 X | None
#    ✅ rebuild_segment_rows(self, char_data: dict | None, ...)
#    ❌ rebuild_segment_rows(self, char_data: dict, ...)
#
# 3. 双后端共享函数使用 Any
#    ✅ get_app_calculation_history(app: Any)
#    ❌ get_app_calculation_history(app: DamageCalculatorApp)
#    # 只用 getattr/setattr 访问属性，不依赖 CTk 类型
#
# 4. 独立脚本的 import 路径问题
#    ✅ from calculation.formula import ...  # pyright: ignore[reportMissingImports]
#    # 独立脚本通过 sys.path.insert 添加路径，Pylance 静态分析不识别
#
# 5. Literal 约束要精确
#    ✅ weight: Literal["normal", "bold"] = "normal"
#    ❌ weight: str = "normal"
#    # CTkFont 的 weight 参数只接受 "normal"/"bold"
#
# 配置参考：../pyrightconfig.json（抑制 mixin/可选访问等安全模式）

