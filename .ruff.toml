# 根级 ruff 配置 — 用于 scripts/ 等无独立 pyproject.toml 的目录
target-version = "py310"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "RUF"]
ignore = [
    "UP009",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "E402",
    "N812",
    "N803",
]

[lint.per-file-ignores]
"scripts/auto_test/*" = ["I001", "SIM102"]
