# 根级 ruff 配置 — 用于 scripts/ 等无独立 pyproject.toml 的目录
target-version = "py310"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "RUF"]
ignore = [
    "UP009",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "E402",
    "N812",
    "N803",
]

[lint.per-file-ignores]
"scripts/auto_test/*" = ["I001", "SIM102"]
"extensions/*" = ["N806", "F841"]
"games/arknights/*" = ["N806", "N999", "SIM105", "SIM108"]
"scripts/*" = ["SIM105", "SIM102", "SIM108", "RUF005"]
"web/backend/*" = ["N806", "SIM102", "SIM105", "SIM108", "E501"]
"games/arknights/gui/ArknightsApp.py" = ["RUF100"]
