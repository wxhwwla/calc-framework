[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endfield_damage_calculator"
dynamic = ["version"]
description = "终末地伤害计算小工具"
authors = [
    { name = "wxhwwla", email = "wxhwwla@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# 开发 / CI：pytest
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]
# 与运行时重复，保留别名便于旧文档/命令
viz = [
    "matplotlib>=3.8",
]
# 插件 YAML 支持（JSON 无需此依赖）
plugins = [
    "pyyaml>=6.0",
]
# 打包：PyInstaller（会拉取 PyPI 的 packaging 等传递依赖；勿建名为 packaging 的本地包）
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
endfield-calculator = "main:main"

[tool.setuptools.dynamic]
version = { attr = "please_read_me._VERSION" }

[tool.setuptools]
py-modules = ["main", "please_read_me"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "calculation*",
    "data*",
    "gui_design*",
    "character_weapon_equipment*",
    "utils*",
    "legal*",
    "release_bundle*",
]
exclude = ["tests*", "scripts*"]

# 打包由 build.py 驱动（PyInstaller --onedir，JSON 外挂于 exe 旁）。
# 勿使用旧版 onefile + --add-data 内嵌数据；见 release_bundle/ 与 docs/操作指令集.md §7。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要 CustomTkinter/Tcl（本地可 -m 'not integration' 跳过）",
    "real_data: 读取本地 characters/weapons/equipments JSON（默认跳过，见 ENDFIELD_RUN_REAL_DATA_TESTS）",
    "slow: 公式暴力反推（CPU 密集，外观像卡住；本地建议跳过）",
]
# 本地日常：pytest -m "not integration and not real_data and not slow"
# CI 仍跑全量：pytest tests/ -q
filterwarnings = ["ignore::DeprecationWarning"]
