[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endfield_damage_calculator"
dynamic = ["version"]
description = "终末地伤害计算小工具"
authors = [
    { name = "wxhwwla", email = "wxhwwla@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
]

[project.optional-dependencies]
# 开发 / CI：pytest
dev = [
    "pytest>=8.0",
]
# 打包：PyInstaller（会拉取 PyPI 的 packaging 等传递依赖；勿建名为 packaging 的本地包）
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
endfield-calculator = "main:main"

[tool.setuptools.dynamic]
version = { attr = "please_read_me._VERSION" }

[tool.setuptools]
py-modules = ["main", "please_read_me"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "calculation*",
    "data*",
    "gui_design*",
    "character_weapon_equipment*",
    "utils*",
    "legal*",
    "release_bundle*",
]
exclude = ["tests*", "scripts*"]

# 打包由 build.py 驱动（PyInstaller --onedir，JSON 外挂于 exe 旁）。
# 勿使用旧版 onefile + --add-data 内嵌数据；见 release_bundle/ 与 docs/操作指令集.md §7。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
