# ── pre-commit 钩子：本地验证 → CI 不卡 ──
# 安装：pip install pre-commit && pre-commit install
# 手动全量检查：pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: "scripts/_version\\.py"
      - id: ruff-format
        name: ruff-format
        types_or: [python, pyi]
        exclude: "scripts/_version\\.py"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-json
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-no-eval
        exclude: "tools/ocr/detector\\.py"
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char
        exclude: "docs/.*\\.md"

  # ── 本地策略检查 ──
  - repo: local
    hooks:
      - id: python-encoding-declaration
        name: Check Python encoding declaration
        entry: |
          python -c "
          import sys
          errors = []
          for f in sys.argv[1:]:
              with open(f, encoding='utf-8') as fh:
                  line1 = fh.readline()
                  line2 = fh.readline()
                  if 'coding' not in line1 and 'coding' not in line2:
                      errors.append(f)
          if errors:
              for e in errors:
                  print('{}: missing coding'.format(e))
              sys.exit(1)
          "
        language: python
        types: [python]

      - id: python-line-count
        name: Check Python file line count
        entry: |
          python -c "
          import sys
          for f in sys.argv[1:]:
              with open(f, encoding='utf-8') as fh:
                  n = len(fh.readlines())
              if n > 400:
                  print('[WARN] {}: {} lines (target <=400, harcap 500)'.format(f, n))
          "
        language: python
        types: [python]
        exclude: |
          (?x)(
            scripts/_version\.py
          )

  # detect-secrets — 与 CI security-audit.yml 共用 baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "package-lock\\.json|poetry\\.lock|.*\\.calcpack|.*\\.zip|\\.tmp-audit-venv.*|\\.secrets\\.baseline"
