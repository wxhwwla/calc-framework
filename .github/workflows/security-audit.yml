# 安全审计 — 依赖漏洞扫描 + 密钥泄露检查
name: Security Audit
permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/frontend/package-lock.json"
      - "web/frontend/package.json"
      - "requirements*.txt"
      - "games/*/pyproject.toml"
      - "framework/pyproject.toml"
      - ".github/workflows/security-audit.yml"
      - ".secrets.baseline"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/frontend/package-lock.json"
      - "web/frontend/package.json"
      - "requirements*.txt"
      - "games/*/pyproject.toml"
      - "framework/pyproject.toml"
      - ".secrets.baseline"
  schedule:
    - cron: "0 8 * * 1"  # 每周一 8:00 UTC

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Web requirements (Docker)
        run: |
          python -m pip install -r requirements.txt
          pip-audit
      - name: Audit framework
        run: |
          cd framework
          python -m pip install -e ".[dev]"
          pip-audit
      - name: Audit endfield
        run: |
          cd games/endfield
          python -m pip install -e ".[dev]"
          pip-audit

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets
      - name: Verify no new secrets vs baseline
        run: python tools/generate_secrets_baseline.py verify
