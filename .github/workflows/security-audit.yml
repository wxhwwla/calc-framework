# 安全审计 — 依赖漏洞扫描 + 密钥泄露检查
name: Security Audit
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - "web/frontend/package-lock.json"
      - "web/frontend/package.json"
      - "requirements*.txt"
      - "games/*/pyproject.toml"
      - "framework/pyproject.toml"
      - ".github/workflows/security-audit.yml"
      - ".secrets.baseline"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/frontend/package-lock.json"
      - "web/frontend/package.json"
      - "requirements*.txt"
      - "games/*/pyproject.toml"
      - "framework/pyproject.toml"
      - ".secrets.baseline"
  schedule:
    - cron: "0 8 * * 1"  # 每周一 8:00 UTC

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        working-directory: .
        run: python tools/quality/npm_audit_gate.py --cwd web/frontend --audit-level low

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        # 一并升级 setuptools，避免 runner 自带旧版本被判为漏洞
        run: python -m pip install --upgrade pip setuptools pip-audit
      - name: Audit Web requirements (Docker)
        run: |
          python -m pip install -r requirements.txt
          pip-audit
      - name: Audit framework
        run: |
          cd framework
          python -m pip install -e ".[dev]"
          pip-audit
      - name: Audit endfield
        run: |
          cd games/endfield
          python -m pip install -e ".[dev]"
          pip-audit
      - name: Audit MCP dependencies
        run: |
          python -m pip install -r requirements-mcp.txt
          pip-audit

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets
      - name: Verify no new secrets vs baseline
        run: python tools/quality/generate_secrets_baseline.py verify
