name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: endfield_damage_calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,plugins]"
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --cov=calculation --cov=data --cov=utils --cov=gui_design --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        run: python -m coverage report --fail-under=60
