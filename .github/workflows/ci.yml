# 游戏包 CI — 终末地伤害计算器
# 包路径：games/endfield/，测试在此目录下

name: Game CI

on:
  push:
    branches: [main, master]
    paths:
      - "games/endfield/**"
      - "games/arknights/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "games/endfield/**"
      - "games/arknights/**"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install framework (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e framework
      - name: Install game packages with dev deps
        run: |
          python -m pip install -e games/endfield ".[dev]"
      - name: Run endfield tests
        run: |
          python -m pytest games/endfield/tests/ -q --cov=games.endfield --cov-report=term-missing --cov-report=xml
      - name: Run arknights tests
        run: |
          python -m pytest games/arknights/tests/ -q --cov=games.arknights --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        run: python -m coverage report --fail-under=40
