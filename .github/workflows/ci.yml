# 游戏包 CI — 终末地伤害计算器
# 包路径：games/endfield/，测试在此目录下
# Rust 扩展：extensions/rust_search/（PyO3/maturin）

name: Game CI
permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
    paths:
      - "games/endfield/**"
      - "games/arknights/**"
      - "tools/**"
      - "web/backend/**"
      - "scripts/**"
      - "extensions/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "games/endfield/**"
      - "games/arknights/**"
      - "tools/**"
      - "web/backend/**"
      - "scripts/**"
      - "extensions/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: |
          cd extensions/rust_search
          cargo test

      - name: Install system deps for Qt6 (PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libegl-mesa0 libegl1 xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install framework (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'

      - name: Install game packages with dev deps
        run: |
          python -m pip install -e 'games/endfield[dev]'

      - name: Install web backend deps
        run: |
          python -m pip install -r web/backend/requirements.txt

      - name: Install maturin and build Rust extension
        run: |
          python -m pip install maturin
          cd extensions/rust_search
          maturin build --release --out dist
          python -m pip install dist/rust_search-*.whl --force-reinstall --no-deps

      - name: Lint check (ruff)
        run: python -m ruff check games/endfield/ framework/src/ web/backend/ scripts/ extensions/

      - name: Run endfield tests
        run: xvfb-run python -m pytest games/endfield/tests/ -q --tb=short --cov=games.endfield --cov-report=term-missing --cov-report=xml

      - name: Run arknights tests
        run: xvfb-run python -m pytest games/arknights/tests/ -q --tb=short --cov=games.arknights --cov-report=term-missing --cov-report=xml || echo "ARKNIGHTS_TESTS_SKIPPED"

      - name: Run tools tests
        run: python -m pytest tools/tests/ -q --tb=short --cov=tools --cov-report=term-missing --cov-report=xml

      - name: Run web backend tests
        run: python -m pytest web/backend/tests/ -q --tb=short

      - name: Coverage summary
        run: python -m coverage report
