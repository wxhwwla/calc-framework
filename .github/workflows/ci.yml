# 游戏包 CI — 终末地 + 明日方舟 + 工具 + Web 后端
# 包路径：games/endfield/、games/arknights/、tools/、web/backend/
# Rust 扩展：extensions/rust_search/（PyO3/maturin）

name: Game CI
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - "games/endfield/**"
      - "games/arknights/**"
      - "tools/**"
      - "web/backend/**"
      - "scripts/**"
      - "extensions/**"
      - "framework/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "games/endfield/**"
      - "games/arknights/**"
      - "tools/**"
      - "web/backend/**"
      - "scripts/**"
      - "extensions/**"
      - "framework/**"

jobs:
  lint:
    name: Lint & Encoding Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml') }}
          restore-keys: pip-lint-

      - name: Install ruff
        run: python -m pip install ruff>=0.5

      - name: Lint check (ruff)
        run: python -m ruff check games/endfield/ games/arknights/ framework/src/ web/backend/ scripts/ extensions/

      - name: Check Python encoding declaration
        run: |
          python -c "
          import os, sys
          errors = []
          exclude = {'.git', 'node_modules', '.tmp-audit-venv','.venv','__pycache__','dist','build','.eggs'}
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in exclude]
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  path = os.path.join(root, f)
                  with open(path, encoding='utf-8') as fh:
                      line1 = fh.readline()
                      line2 = fh.readline()
                  if 'coding' not in line1 and 'coding' not in line2:
                      errors.append(path)
          if errors:
              for e in errors:
                  print('FAIL: {} missing coding'.format(e))
              sys.exit(1)
          print('All .py files have encoding declaration')
          "

  rust:
    name: Rust Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "extensions/rust_search -> target"

      - name: Run Rust tests
        run: |
          cd extensions/rust_search
          cargo test

  test:
    name: Python Tests
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml', 'web/backend/requirements.txt', 'requirements-web.txt') }}
          restore-keys: pip-test-

      - name: Install system deps for Qt6 (PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libegl-mesa0 libegl1 xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 python3-tk

      - name: Install framework (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'

      - name: Install game packages with dev deps
        run: |
          python -m pip install -e 'games/endfield[dev]'

      - name: Install web backend deps
        run: |
          python -m pip install -r web/backend/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "extensions/rust_search -> target"

      - name: Install maturin and build Rust extension
        run: |
          python -m pip install maturin
          cd extensions/rust_search
          maturin build --release --out dist
          python -m pip install dist/rust_search-*.whl --force-reinstall --no-deps

      - name: Run endfield tests
        run: |
          xvfb-run python -m pytest games/endfield/tests/ -q --tb=short \
            --cov=games.endfield --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=60

      - name: Run arknights tests
        run: |
          xvfb-run python -m pytest games/arknights/tests/ -q --tb=short \
            --cov=games.arknights --cov-report=term-missing --cov-report=xml

      - name: Run tools tests
        run: python -m pytest tools/tests/ -q --tb=short --cov=tools --cov-report=term-missing --cov-report=xml

      - name: Run web backend tests
        run: python -m pytest web/backend/tests/ -q --tb=short

      - name: Coverage summary
        if: always()
        run: |
          python -m coverage combine 2>/dev/null || true
          python -m coverage report --fail-under=60 || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/coverage.xml"
          if-no-files-found: ignore
