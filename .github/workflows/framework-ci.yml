# Framework CI — calc-framework 包
# 包路径：framework/，含 DAG 引擎 + graph_editor 可视化编辑器

name: Framework CI
permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - "framework/**"
      - ".github/workflows/framework-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "framework/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-framework-${{ hashFiles('framework/pyproject.toml') }}
          restore-keys: pip-framework-

      - name: Install system deps for Qt6 (PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libegl-mesa0 libegl1 xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"

      - name: Lint check (ruff)
        run: python -m ruff check src/ tests/

      - name: Run tests with coverage (with xvfb for Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run python -m pytest tests/ -q --ignore=tests/benchmarks/ --cov=calc_framework --cov-report=term --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-coverage
          path: framework/coverage.xml
          if-no-files-found: ignore

  benchmark:
    name: Benchmark (DAG engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-framework-${{ hashFiles('framework/pyproject.toml') }}
          restore-keys: pip-framework-

      - name: Install system deps for Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libegl-mesa0 libegl1 xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"

      - name: Run benchmarks
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run python -m pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark.json --benchmark-min-rounds=3

      - name: Store benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: framework/benchmark.json
          if-no-files-found: ignore
