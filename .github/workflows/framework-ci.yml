# Framework CI — calc-framework 包
# 包路径：framework/，含 DAG 引擎 + graph_editor 可视化编辑器

name: Framework CI
permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - "framework/**"
      - ".github/workflows/framework-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "framework/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps for Qt6 (PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libegl1-mesa libegl1 xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"
      - name: Lint check (ruff)
        run: python -m ruff check src/ tests/
      - name: Run tests with coverage (with xvfb for Qt)
        run: xvfb-run python -m pytest tests/ -q --cov=calc_framework --cov-report=term --cov-fail-under=80
