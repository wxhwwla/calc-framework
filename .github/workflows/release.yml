# Release — 终末地伤害计算器打包发布
# 包路径：games/endfield/，build.py 在 scripts/，please_read_me.py 在 scripts/
# 触发方式：python github_upload_module.py --tag（本地创建并推送已签名的 tag）
# Verified 保障：tag 由上传脚本带 -s 签名，推送后 GitHub 应显示 Verified 标记

name: Release
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-version:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    outputs:
      tag_version: ${{ steps.version.outputs.tag_version }}
      code_version: ${{ steps.version.outputs.code_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e framework
      - name: Install game package
        run: python -m pip install -e games/endfield ".[dev]"
      - name: Check version consistency
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tag_version = $tag -replace '^v', ''
          $code_version = python -c "import sys; sys.path.insert(0, 'scripts'); import please_read_me; print(please_read_me._EXE_VERSION)"
          echo "tag_version=$tag_version" >> $env:GITHUB_OUTPUT
          echo "code_version=$code_version" >> $env:GITHUB_OUTPUT
          if ($tag_version -ne $code_version) {
            Write-Error "Tag version v${tag_version} does not match _EXE_VERSION ${code_version}"
            exit 1
          }
          Write-Host "Version check passed: v${tag_version}"
          $source_version = python -c "import sys; sys.path.insert(0, 'scripts'); import please_read_me; print(please_read_me._VERSION)"
          Write-Host "Source _VERSION: ${source_version}"

  test:
    needs: verify-version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: |
          cd extensions/rust_search
          cargo test
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e framework
          python -m pip install -e games/endfield ".[dev]"
      - name: Install maturin and build Rust extension
        run: |
          pip install maturin
          cd extensions/rust_search
          maturin build --release --out dist
          pip install dist/rust_search-*.whl --force-reinstall --no-deps
      - name: Run tests
        run: python -m pytest games/endfield/tests/ framework/tests/ -q --tb=short

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e framework
          python -m pip install -e games/endfield ".[dev,build]"
      - name: Build release (launcher)
        run: python scripts/main_build.py --target launcher --no-bump
      - name: Package ZIP artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.verify-version.outputs.tag_version }}"
          # 主产物：启动器（单 exe，含所有游戏+工具）
          if (Test-Path "dist/Game Calc Platform") {
            $launcher_zip = "GameCalcPlatform_v${version}.zip"
            Compress-Archive -Path "dist/Game Calc Platform/*" -DestinationPath "dist/${launcher_zip}"
            Write-Host "Created: dist/${launcher_zip}"
          }
          # 过渡期：继续打包旧分体目标（供仍需独立 exe 的用户）
          if (Test-Path "dist/终末地伤害计算器") {
            $name = "终末地伤害计算器_v${version}.zip"
            Compress-Archive -Path "dist/终末地伤害计算器/*" -DestinationPath "dist/${name}"
            Write-Host "Created: dist/${name}"
          }
          if (Test-Path "dist/数据设计器") {
            $designer_zip = "数据设计器_v${version}.zip"
            Compress-Archive -Path "dist/数据设计器/*" -DestinationPath "dist/${designer_zip}"
            Write-Host "Created: dist/${designer_zip}"
          }
          if (Test-Path "dist/配置包设计器") {
            $pack_zip = "配置包设计器_v${version}.zip"
            Compress-Archive -Path "dist/配置包设计器/*" -DestinationPath "dist/${pack_zip}"
            Write-Host "Created: dist/${pack_zip}"
          }
          # SHA256 侧车（自动更新校验）
          Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $sidecar = "$($_.FullName).sha256"
            Set-Content -Path $sidecar -Value $hash -NoNewline
            Write-Host "Created: $sidecar"
          }

      - name: Code sign release PE (optional)
        shell: pwsh
        continue-on-error: true
        env:
          CODE_SIGN_ENABLED: ${{ secrets.CODE_SIGN_CERT_SHA1 != '' && '1' || '' }}
          CODE_SIGN_CERT_SHA1: ${{ secrets.CODE_SIGN_CERT_SHA1 }}
          CODE_SIGN_PFX_PATH: ${{ runner.temp }}/codesign.pfx
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGN_CERT_SHA1 -and -not $env:CODE_SIGN_PFX_PASSWORD) {
            Write-Host "Skip code signing: no secrets configured"
            exit 0
          }
          if ($env:CODE_SIGN_PFX_PASSWORD) {
            $bytes = [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX_BASE64 }}")
            [IO.File]::WriteAllBytes($env:CODE_SIGN_PFX_PATH, $bytes)
          }
          $env:CODE_SIGN_ENABLED = "1"
          if (Test-Path "dist/Game Calc Platform") {
            python -c "from pathlib import Path; from utils.code_sign import sign_release_tree; print(len(sign_release_tree(Path('dist/Game Calc Platform'))))"
          }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          python scripts/devtool.py installer build --version "${{ needs.verify-version.outputs.tag_version }}"
        continue-on-error: true

      - name: List dist artifacts
        shell: pwsh
        run: Get-ChildItem dist/ -Name | Select-Object

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            dist/GameCalcPlatform_v*.zip
            dist/GameCalcPlatform_v*.zip.sha256
            dist/终末地伤害计算器_v*.zip
            dist/终末地伤害计算器_v*.zip.sha256
            dist/数据设计器_v*.zip
            dist/数据设计器_v*.zip.sha256
            dist/配置包设计器_v*.zip
            dist/配置包设计器_v*.zip.sha256
            dist/GameCalcPlatform_Setup_v*.exe

  publish:
    needs: [build, verify-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact
      - name: List downloaded artifacts
        shell: bash
        run: ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ needs.verify-version.outputs.tag_version }}"
          tag_name: ${{ github.ref_name }}
          files: |
            GameCalcPlatform_v${{ needs.verify-version.outputs.tag_version }}.zip
            GameCalcPlatform_v${{ needs.verify-version.outputs.tag_version }}.zip.sha256
            终末地伤害计算器_v${{ needs.verify-version.outputs.tag_version }}.zip
            终末地伤害计算器_v${{ needs.verify-version.outputs.tag_version }}.zip.sha256
            数据设计器_v${{ needs.verify-version.outputs.tag_version }}.zip
            数据设计器_v${{ needs.verify-version.outputs.tag_version }}.zip.sha256
            配置包设计器_v${{ needs.verify-version.outputs.tag_version }}.zip
            配置包设计器_v${{ needs.verify-version.outputs.tag_version }}.zip.sha256
            GameCalcPlatform_Setup_v${{ needs.verify-version.outputs.tag_version }}.exe
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
