# Web CI — 前端编译 + 后端 lint/测试
# 作为 web-e2e.yml（Cypress 全量 E2E）之前的快速反馈层
# 每次 web/** 变更时运行，约 2-3 分钟

name: Web CI
permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"

jobs:
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-curve
        working-directory: web/wasm-curve
        run: wasm-pack build --target web --out-dir ../frontend/public/wasm-curve --release

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings 50

      - name: Production build
        run: npx vite build

      - name: Bundle size check
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/assets/*.js | sort -rh | head -10
          echo ""
          TOTAL=$(du -sb dist/ | cut -f1)
          echo "Total: $((TOTAL / 1024)) KB"
          if [ $TOTAL -gt 3072000 ]; then
            echo "⚠️ Warning: Total bundle > 3 MB"
          fi

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (EGL for PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'
          python -m pip install -e 'games/endfield[dev]'
          python -m pip install -r web/backend/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check web/backend/

      - name: Test backend API
        run: python -m pytest web/backend/tests/ -q
