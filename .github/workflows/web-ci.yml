# Web CI — 前端编译/单测 + 后端 lint/测试
# 作为 web-e2e.yml（Cypress 全量 E2E）之前的快速反馈层
# 每次 web/** 变更时运行，约 2-3 分钟

name: Web CI
permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "extensions/rust_search/**"
      - "web/wasm-curve/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "extensions/rust_search/**"
      - "web/wasm-curve/**"

jobs:
  frontend:
    name: Frontend (tsc + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable 分支当前提交
        with:
          toolchain: stable

      - name: Cache Rust wasm-curve
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: "web/wasm-curve -> target"

      - name: Install wasm-pack and binaryen (wasm-opt)
        run: |
          # binaryen 提供系统 wasm-opt，避免 wasm-pack 从 GitHub Releases 下载挂起（act/代理环境）
          sudo apt-get update
          sudo apt-get install -y binaryen
          # 本地 act 镜像可能已预装 wasm-pack；已安装时跳过联网安装脚本
          if command -v wasm-pack >/dev/null 2>&1; then
            echo "wasm-pack already installed: $(wasm-pack --version)"
          else
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: Build wasm-curve
        working-directory: web/wasm-curve
        run: wasm-pack build --target web --out-dir ../frontend/public/wasm-curve --release

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Build output guard (PWA / lazy loading)
        run: npm run check:build

      - name: Bundle size check
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/assets/*.js | sort -rh | head -10
          echo ""
          TOTAL=$(du -sb dist/ | cut -f1)
          BUDGET=4000000
          echo "Total: $((TOTAL / 1024)) KB (budget: $((BUDGET / 1024)) KB)"
          if [ "$TOTAL" -gt "$BUDGET" ]; then
            echo "::error::Total bundle $((TOTAL / 1024)) KB exceeds hard budget $((BUDGET / 1024)) KB"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: frontend-dist
          path: web/frontend/dist/
          retention-days: 3

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # actions/cache v4
        with:
          path: ~/.cache/pip
          key: pip-web-backend-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml', 'requirements-web.txt') }}
          restore-keys: pip-web-backend-

      - name: Install system deps (Qt/EGL for PySide6)
        run: |
          # 与 Game CI / Framework CI 对齐：act 镜像比 GitHub runner 瘦，缺任一 .so 都会在 import PySide6 时失败
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libegl-mesa0 libgl1 \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'
          python -m pip install -e 'games/endfield[dev]'
          python -m pip install -r web/backend/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check web/backend/

      - name: Test backend API
        run: python -m pytest web/backend/tests/ -q --tb=short
