# Web CI — 前端编译 + 后端 lint/测试
# 作为 web-e2e.yml（Cypress 全量 E2E）之前的快速反馈层
# 每次 web/** 变更时运行，约 2-3 分钟

name: Web CI
permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "extensions/rust_search/**"
      - "web/wasm-curve/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "extensions/rust_search/**"
      - "web/wasm-curve/**"

jobs:
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust wasm-curve
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web/wasm-curve -> target"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-curve
        working-directory: web/wasm-curve
        run: wasm-pack build --target web --out-dir ../frontend/public/wasm-curve --release

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings 50

      - name: Production build
        run: npx vite build

      - name: Bundle size check
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/assets/*.js | sort -rh | head -10
          echo ""
          TOTAL=$(du -sb dist/ | cut -f1)
          echo "Total: $((TOTAL / 1024)) KB"
          if [ $TOTAL -gt 3072000 ]; then
            echo "::warning::Total bundle > 3 MB ($((TOTAL / 1024)) KB)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/frontend/dist/
          retention-days: 3

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-web-backend-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml', 'requirements-web.txt') }}
          restore-keys: pip-web-backend-

      - name: Install system deps (EGL for PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'
          python -m pip install -e 'games/endfield[dev]'
          python -m pip install -r web/backend/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check web/backend/

      - name: Test backend API
        run: python -m pytest web/backend/tests/ -q --tb=short
