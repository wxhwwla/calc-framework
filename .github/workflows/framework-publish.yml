# Framework PyPI Publish — calc-framework 包发布

name: Framework PyPI Publish
permissions:
  contents: read

concurrency:
  group: framework-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (如 0.2.0)"
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Validate version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "错误: 版本号 '$VERSION' 格式无效，必须为 x.y.z"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Update version
        shell: python
        run: |
          import os, re
          with open('pyproject.toml') as f:
              content = f.read()
          content = re.sub(r'version = ".*"', f'version = "{os.environ["version"]}"', content, count=1)
          with open('pyproject.toml', 'w') as f:
              f.write(content)

      - name: Build distribution
        run: python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: framework-v${{ github.event.inputs.version }}
          name: calc-framework v${{ github.event.inputs.version }}
          body: |
            calc-framework v${{ github.event.inputs.version }}

            安装：`pip install calc-framework`
          draft: false
          prerelease: false
          files: framework/dist/calc_framework-${{ github.event.inputs.version }}*.whl
          token: ${{ secrets.GITHUB_TOKEN }}
