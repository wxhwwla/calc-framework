name: Code Origin Check
permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
    paths: ["**.py"]
  pull_request:
    branches: [main, master, develop]
    paths: ["**.py"]
  workflow_dispatch:

jobs:
  check-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run static origin checks (license + suspicious + internal dup)
        run: python tools/check_code_origin.py --ci --skip git-diff

      - name: Run git-diff checks for new/modified files
        if: github.event_name == 'pull_request'
        run: python tools/check_code_origin.py --ci --skip license-header internal-dup suspicious --since origin/${{ github.base_ref }}
