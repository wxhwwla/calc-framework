name: Code Origin Check

on:
  pull_request:
    paths: ["**.py"]
  push:
    paths: ["**.py"]
  workflow_dispatch:

jobs:
  check-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run code origin check
        run: |
          python tools/check_code_origin.py --ci

      - name: Check for new file license headers
        run: |
          python tools/check_code_origin.py --ci --since origin/${{ github.base_ref || 'main' }}
