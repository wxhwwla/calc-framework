name: Code Origin Check
permissions:
  contents: read

concurrency:
  group: code-origin-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths: ["**.py"]
  pull_request:
    branches: [main, master, develop]
    paths: ["**.py"]
  workflow_dispatch:

jobs:
  check-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Run static origin checks (license + suspicious + internal dup)
        run: python tools/quality/check_code_origin.py --ci --skip git-diff

      - name: Run git-diff checks for new/modified files
        if: github.event_name == 'pull_request'
        run: python tools/quality/check_code_origin.py --ci --skip license-header internal-dup suspicious --since origin/${{ github.base_ref }}
