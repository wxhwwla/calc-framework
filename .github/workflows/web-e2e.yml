# Web E2E 测试 — Cypress
# 启动后端 + 前端 dev server → 运行 Cypress E2E 测试

name: Web E2E
permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (EGL for PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'
          python -m pip install -e 'games/endfield[dev]'
          python -m pip install -r web/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: TypeScript 编译验证
        working-directory: web/frontend
        run: npx tsc --noEmit

      - name: 启动后端 API 服务
        run: |
          cd web/backend
          uvicorn main:app --port 8180 > /tmp/uvicorn.log 2>&1 &
          sleep 5
          curl -s http://localhost:8180/api/layout -o /dev/null || (cat /tmp/uvicorn.log; echo "Backend failed to start"; exit 1)

      - name: 启动前端 dev server
        working-directory: web/frontend
        run: |
          npx vite --port 5173 &
          sleep 5
          curl -s http://localhost:5173 -o /dev/null || (echo "Frontend failed to start"; exit 1)

      - name: 运行 Cypress E2E 测试
        working-directory: web/frontend
        continue-on-error: true
        run: npx cypress run --e2e --browser=electron

      - name: 打印后端日志（调试用）
        if: always()
        run: cat /tmp/uvicorn.log || true

      - name: 上传 Cypress 截图（测试失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/frontend/cypress/screenshots/
          if-no-files-found: ignore
