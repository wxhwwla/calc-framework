# Web E2E 测试 — Cypress
# 启动后端 + 前端 dev server → 运行 Cypress E2E 测试

name: Web E2E
permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "framework/**"
      - "games/endfield/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "framework/**"
      - "games/endfield/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Qt/EGL for PySide6)
        run: |
          # 与 web-ci / Game CI 对齐，避免 act 镜像缺 PySide6 共享库
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libegl-mesa0 libgl1 \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1


      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-e2e-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml', 'requirements-web.txt') }}
          restore-keys: pip-e2e-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'
          python -m pip install -e 'games/endfield[dev]'
          python -m pip install -r web/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: 启动后端 API 服务
        run: |
          cd web/backend
          uvicorn main:app --port 8180 > /tmp/uvicorn.log 2>&1 &
          sleep 5
          curl -s http://localhost:8180/api/layout -o /dev/null || (cat /tmp/uvicorn.log; echo "Backend failed to start"; exit 1)

      - name: Build frontend
        working-directory: web/frontend
        run: npx vite build

      - name: 启动前端 preview server
        working-directory: web/frontend
        run: |
          npx vite preview --port 5173 &
          sleep 3
          curl -s http://localhost:5173 -o /dev/null || (echo "Frontend failed to start"; exit 1)

      - name: 运行 Cypress E2E 测试
        id: e2e
        working-directory: web/frontend
        continue-on-error: true
        run: npx cypress run --e2e --browser=electron

      - name: 检查 E2E 测试结果
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.e2e.outcome }}" = "failure" ]; then
            echo "::warning::Cypress E2E 测试失败（步骤已设置 continue-on-error，未阻塞）"
          else
            echo "Cypress E2E 测试通过"
          fi

      - name: 打印后端日志（调试用）
        if: always()
        run: cat /tmp/uvicorn.log || true

      - name: 上传 Cypress 截图（测试失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/frontend/cypress/screenshots/
          if-no-files-found: ignore

      - name: 上传 Cypress 视频（如有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: web/frontend/cypress/videos/
          if-no-files-found: ignore
