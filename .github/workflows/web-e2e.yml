# Web E2E 测试 — Cypress
# 启动后端 + 前端 dev server → 运行 Cypress E2E 测试

name: Web E2E
permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "framework/**"
      - "games/endfield/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"
      - "framework/**"
      - "games/endfield/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install system deps (Qt/EGL for PySide6)
        run: |
          # 与 web-ci / Game CI 对齐，避免 act 镜像缺 PySide6 共享库；
          # GitHub runner 已预装 Xvfb 与 Cypress Electron 运行库，act 镜像没有，需显式安装
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libegl-mesa0 libgl1 \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            xvfb \
            libgtk-3-0t64 libgbm1 libnotify4 libnss3 libxss1 \
            libasound2t64 libatspi2.0-0 libxtst6 xdg-utils


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: pip-e2e-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml', 'requirements-web.txt') }}
          restore-keys: pip-e2e-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'framework[dev]'
          python -m pip install -e 'games/endfield[dev]'
          python -m pip install -r web/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: 启动后端 API 服务
        env:
          # E2E 单个页面会发起十余个 API 请求，匿名限流 20 次/分钟会立刻返回 429，
          # 导致页面数据加载失败、用例大面积超时。限流属于部署层，测试中关闭。
          CALC_DISABLE_RATE_LIMIT: "1"
          # API 文档生产默认关闭；Cypress 的「打开 API 文档页」用例需显式开启。
          CALC_ENABLE_API_DOCS: "1"
        run: |
          cd web/backend
          uvicorn main:app --port 8180 > /tmp/uvicorn.log 2>&1 &
          # 冷启动时导入框架可能超过 5 秒；轮询最多 60 秒，避免固定 sleep 造成偶发失败。
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8180/api/layout -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn.log
          echo "Backend failed to start"
          exit 1

      - name: Build frontend
        working-directory: web/frontend
        run: npx vite build

      - name: 启动前端 preview server
        working-directory: web/frontend
        run: |
          npx vite preview --port 5173 &
          sleep 3
          curl -s http://localhost:5173 -o /dev/null || (echo "Frontend failed to start"; exit 1)

      - name: 运行 Cypress E2E 测试
        working-directory: web/frontend
        run: npx cypress run --e2e --browser=electron

      - name: 打印后端日志（调试用）
        if: always()
        run: cat /tmp/uvicorn.log || true

      - name: 上传 Cypress 截图（测试失败时）
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cypress-screenshots
          path: web/frontend/cypress/screenshots/
          if-no-files-found: ignore

      - name: 上传 Cypress 视频（如有）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cypress-videos
          path: web/frontend/cypress/videos/
          if-no-files-found: ignore
