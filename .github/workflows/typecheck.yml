# Pyright 类型检查 CI
# 对 Python 代码运行 pyright 静态类型分析

name: Type Check
permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('framework/pyproject.toml', 'games/endfield/pyproject.toml') }}
          restore-keys: pip-typecheck-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyright
          python -m pip install -e 'framework[dev,ui]'
          python -m pip install -e 'games/endfield[dev]'

      - name: Run pyright
        run: pyright
