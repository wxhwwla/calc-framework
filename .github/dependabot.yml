# Dependabot 依赖扫描（仅告警，不开 PR）
# docs: https://docs.github.com/code-security/dependabot
#
# 仓库分支策略：远程仅长期保留 main + develop。
# open-pull-requests-limit: 0 → 仍写 Security/Dependabot 告警，但**不创建**
# dependabot/* 分支与 PR，避免合 main 后一窝蜂再开一堆 bot 分支。
# 日常依赖升级由维护者按需手动改 + 上传脚本推送。
#
# ⚠️ GitHub 只读取**默认分支 main** 上的本文件。只提交到 develop 不会生效：
#    每月扫描仍按 main 的旧配置创建 PR/分支。修改后须用
#    `python github_upload_module.py --minor` 合并 develop → main 才会落盘。

version: 2
updates:

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/framework"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/games/endfield"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/web/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/extensions/rust_search"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
