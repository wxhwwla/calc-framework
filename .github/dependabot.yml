# Dependabot 自动化依赖更新
# docs: https://docs.github.com/code-security/dependabot

version: 2
updates:

  # Python 依赖（pip — 框架 + 游戏包 + Web）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip-root:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/framework"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip-framework:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/games/endfield"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip-endfield:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node.js 依赖（npm — Web 前端）
  - package-ecosystem: "npm"
    directory: "/web/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Rust 依赖（Cargo — rust_search 扩展）
  - package-ecosystem: "cargo"
    directory: "/extensions/rust_search"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-rust-search:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      gh-actions:
        patterns: ["*"]
