name: 功能建议
description: 提出新功能或改进现有体验（非 Bug）
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        说明你想解决的使用场景即可；不必写实现方案，除非已有明确想法。

  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 现在哪里不方便？你想达成什么目标？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望产品如何表现？可写交互草图或文案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 考虑过哪些替代做法？
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 对你而言的重要程度
      options:
        - 锦上添花
        - 能明显提升日常使用
        - 阻塞我使用本工具
    validations:
      required: false

  - type: dropdown
    id: interested
    attributes:
      label: 你是否愿意参与实现？（可选）
      description: 帮助维护者判断是否需要标记 `help-wanted` 或 `good-first-issue` 招募其他贡献者。
      options:
        - 我希望别人来实现
        - 我想尝试自己实现（欢迎指导）
        - 我已经有实现方案
    validations:
      required: false
