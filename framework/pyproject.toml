[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-framework"
version = "0.2.0"
description = "通用游戏数值计算框架 — DAG 公式引擎 + 声明式 UI 渲染 + 搜索枚举引擎"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "wxhwwla", email = "wxhwwla@gmail.com" },
]
keywords = ["game", "calculator", "damage", "dag", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wxhwwla/calc-framework"
Repository = "https://github.com/wxhwwla/calc-framework"
Documentation = "https://github.com/wxhwwla/calc-framework#readme"
"Bug Tracker" = "https://github.com/wxhwwla/calc-framework/issues"

[project.scripts]
calc-layout = "calc_framework.editor.__main__:main"
calc-graph = "calc_framework.graph_editor.__main__:main"
calc-launcher = "calc_framework.launcher:run_launcher"

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "*/dag/debugger_cli.py",
    "*/dag/debugger_gui.py",
    "*/graph_editor/__main__.py",
    "*/graph_editor/help_content.py",
    "*/graph_editor/help_dialog.py",
    "*/launcher.py",
    "*/ui/__main__.py",
    "*/ui/theme.py",
    "*/ui/viewer.py",
    "*/editor/__main__.py",
    "*/editor/gui.py",
    "*/graph_editor/graph_editor_widget.py",
    "*/graph_editor/node_panel.py",
    "*/graph_editor/prop_panel.py",
    "*/ui/compute_sheet.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
