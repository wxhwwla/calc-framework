[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-framework"
version = "0.3.0"
description = "通用游戏数值计算框架 — DAG 公式引擎 + 声明式 UI 渲染 + 搜索枚举引擎。纯 pip 安装后 DAG 引擎/搜索/inverse 开箱即用；GUI 功能（CalcPackViewer/ComputeSheet）需完整项目环境。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "wxhwwla", email = "wxhwwla@gmail.com" },
]
keywords = ["game", "calculator", "damage", "dag", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wxhwwla/calc-framework"
Repository = "https://github.com/wxhwwla/calc-framework"
Documentation = "https://github.com/wxhwwla/calc-framework#readme"
"Bug Tracker" = "https://github.com/wxhwwla/calc-framework/issues"

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[project.scripts]
calc-layout = "calc_framework.editor.__main__:main"
calc-graph = "calc_framework.graph_editor.__main__:main"
calc-launcher = "calc_framework.launcher:run_launcher"

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
dev = ["pytest>=8", "pytest-benchmark>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: 耗时 > 5 秒的测试，本地日常跳过",
    "integration: 依赖外部系统（文件 I/O、DB）的测试",
]

[tool.coverage.run]
omit = [
    "*/dag/debugger_cli.py",
    "*/dag/debugger_gui.py",
    "*/graph_editor/__main__.py",
    "*/graph_editor/help_content.py",
    "*/graph_editor/help_dialog.py",
    "*/graph_editor/help_menu.py",
    "*/graph_editor/help_nodes.py",
    "*/launcher.py",
    "*/ui/__main__.py",
    "*/ui/theme.py",
    "*/ui/viewer.py",
    "*/editor/__main__.py",
    "*/editor/gui.py",
    "*/graph_editor/graph_editor_widget.py",
    "*/graph_editor/node_panel.py",
    "*/graph_editor/prop_panel.py",
    "*/ui/compute_sheet.py",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "E402",
    "N812",
    "N803",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF", "N802", "N806", "SIM115"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
